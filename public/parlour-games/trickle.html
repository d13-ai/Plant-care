<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E1633">
<title>Trickle — a calm watering puzzle</title>
<meta name="description" content="Turn the pipes until the water reaches every plant. No timer, no score, nothing to lose. A quiet puzzle from PlantParlour.">
<style>
/*
 * Trickle — a calm watering puzzle, the first of the Parlour Games.
 * Step 1 of the build order: the core game.
 *
 * Ported from the Pipe Down spec. Everything is inline on purpose: no fonts
 * it cannot fall back from, no audio files, no libraries. It works offline
 * once open and embeds anywhere.
 *
 * Steps 1-5: core game, persistence, practice, account sync, sound and
 * night. Still to come (spec §14): daily, embed, share, analytics, SEO.
 */
:root{
  /* PlantParlour's palette, in the roles the spec names. */
  --ink:#2E1633;          /* page */
  --card:#3A1C41;         /* raised surface */
  --border:rgba(201,162,75,.32);
  --gold:#C9A24B;
  --gold-light:#E6C46B;
  --cream:#F3ECDD;
  --cream-bright:#FBF7EE;
  --muted:#C8B8C2;
  --plum:#4B2142;
  /* Contrast between these two is what makes the puzzle readable. */
  --pipe-dry:#5C3B60;
  --pipe-wet:#8FC79E;
  --water:#FBF7EE;
  --focus:#E6C46B;
}
/* Night: the same roles, turned right down. Measured rather than eyeballed --
   muted text 4.99:1 on the page (4.5 needed), and dry against wet pipes
   3.91:1, over the 3:1 a graphic needs to stay legible. */
body.night{
  --ink:#140A17;
  --card:#1E1023;
  --border:rgba(201,162,75,.18);
  --gold:#8C6F35;
  --gold-light:#A98A4A;
  --cream:#BFB3B9;
  --muted:#8D7D88;
  --pipe-dry:#2E1F33;
  --pipe-wet:#5E8A69;
  --water:#A9B8AC;
  --focus:#A98A4A;
}
body{transition:background .8s,color .8s}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* .controls sets display:flex, which otherwise wins */
html,body{margin:0;background:var(--ink);color:var(--cream)}
body{
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  padding:20px 12px 40px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
main{max-width:560px;margin:0 auto;display:grid;gap:18px;justify-items:center}
h1{
  font-family:Lora,Georgia,"Times New Roman",serif;
  font-weight:700;font-size:30px;line-height:1.15;margin:0;text-align:center;
}
.tagline{
  font-family:Lora,Georgia,serif;font-style:italic;font-size:15px;
  color:var(--muted);margin:0;text-align:center;
}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button{font:inherit;cursor:pointer}
.btn{
  background:transparent;color:var(--cream);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 14px;font-weight:600;font-size:15px;
}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.sizes{display:flex;gap:6px;background:rgba(0,0,0,.18);padding:4px;border-radius:12px}
.sizes .btn{border-color:transparent;padding:6px 12px}

/* The board. Square cells; the whole thing scales with the viewport so an
   8x8 still clears a 44px tap target on a 390px phone. */
#board{
  display:grid;gap:2px;width:100%;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:8px;
  touch-action:manipulation;
}
/* An 8x8 has to clear a 44px tap target on a 390px phone, and at that width
   every pixel of padding is one the tiles do not get. Only the biggest board
   pays for it; 4x4 and 6x6 keep the roomier frame. */
#board[data-n="8"]{padding:4px;gap:1px}
@media (max-width:420px){ body{padding-left:10px;padding-right:10px} }
.tile{
  appearance:none;-webkit-appearance:none;
  background:transparent;border:0;padding:0;margin:0;
  aspect-ratio:1;display:block;width:100%;
  border-radius:8px;
}
.tile:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tile svg{display:block;width:100%;height:100%;transition:transform .25s ease}
.pipe path,.flow path{fill:none;stroke-linecap:round}
.pipe path{stroke:var(--pipe-dry);stroke-width:15}
.cap{fill:var(--pipe-dry)}
.tile.flowing .pipe path{stroke:var(--pipe-wet)}
.tile.flowing .cap{fill:var(--pipe-wet)}
.flow path{stroke:var(--water);stroke-width:5;opacity:0;stroke-dasharray:7 15}
.tile.flowing .flow path{opacity:.9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.valve{fill:var(--gold)}
.tile.flowing .valve{fill:var(--gold-light)}

.hub{margin:0;font-size:14px}
.coach{
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:0 12px 12px 0;padding:12px 14px;width:100%;
}
.coach p{margin:0;font-size:15px;color:var(--cream)}
/* The next pipe the water can reach. Steady under reduced motion; the
   outline alone still says which one. */
.tile.hint{outline:2px solid var(--gold-light);outline-offset:-3px;border-radius:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{outline-color:var(--gold-light)}50%{outline-color:rgba(230,196,107,.25)}}
.hub a{color:var(--gold-light);text-decoration:none;border-bottom:1px solid var(--border)}
.hub a:hover{border-color:var(--gold-light)}
.status{display:flex;gap:16px;justify-content:center;font-size:15px;color:var(--muted)}
.status b{color:var(--cream);font-weight:700}
.records{margin:-10px 0 0;font-size:14px;color:var(--muted);text-align:center}
.records b{color:var(--gold-light);font-weight:700}
.save{margin:-8px 0 0;font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.save a{color:var(--gold-light)}

.panel{
  background:var(--cream);color:var(--ink);
  border:1px solid var(--gold);border-radius:14px;
  padding:18px;width:100%;display:grid;gap:10px;justify-items:center;text-align:center;
}
.panel h2{font-family:Lora,Georgia,serif;font-size:22px;margin:0}
.panel p{margin:0;color:#6B5A6B;font-size:15px}
.panel #win-line{color:var(--ink);font-weight:600}
.panel .best{color:#1F3D2B;font-weight:700}

@media (prefers-reduced-motion:reduce){
  .tile svg{transition:none}
  .tile.flowing .flow path{animation:none}
  .tile.hint{animation:none}
}
</style>
</head>
<body>
<main>
  <h1>Trickle</h1>
  <p class="tagline">Turn the pipes until the water reaches every plant.</p>
  <p class="hub"><a href="/parlour-games">← Parlour Games</a> <span id="learn-link"> · <a href="?learn=1">How to play</a></span></p>

  <div class="coach" id="coach" hidden><p id="coach-line"></p></div>

  <div class="controls">
    <div class="sizes" role="group" aria-label="Board size">
      <button class="btn" data-size="4" type="button">Easy</button>
      <button class="btn" data-size="6" type="button">Chill</button>
      <button class="btn" data-size="8" type="button">Deep</button>
    </div>
    <button class="btn" id="new" type="button">New board</button>
    <button class="btn" id="nudge" type="button">Nudge a tile</button>
    <button class="btn" id="sound" type="button" aria-pressed="false">Sound</button>
    <button class="btn" id="music" type="button" aria-pressed="false">Music</button>
    <button class="btn" id="night" type="button" aria-pressed="false">Night</button>
  </div>

  <div id="board" role="application" aria-label="Watering puzzle. Arrow keys move between tiles; Enter turns one."></div>

  <p class="status"><span>Turns <b id="moves">0</b></span><span>Flowing <b id="lit">0</b></span></p>
  <p class="records" id="records" hidden></p>
  <p class="save" id="save"></p>

  <div class="panel" id="win" hidden>
    <h2>The water's running</h2>
    <p id="win-line"></p>
    <p id="win-tally"></p>
    <button class="btn primary" id="again" type="button">Another board</button>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ---- tile model: four bits, one per opening -------------------------- */
  var DIRS = [
    { bit: 1, dx: 0, dy: -1, opp: 4 },   /* N */
    { bit: 2, dx: 1, dy: 0, opp: 8 },    /* E */
    { bit: 4, dx: 0, dy: 1, opp: 1 },    /* S */
    { bit: 8, dx: -1, dy: 0, opp: 2 }    /* W */
  ];
  function rotate(mask, r) {
    r = ((r % 4) + 4) % 4;
    return ((mask << r) | (mask >> (4 - r))) & 15;
  }

  /* Modes are read from the URL at startup. Only practice so far; daily and
     embed join it later, and practice wins over both. */
  var LEARN = /[?&]learn=1/.test(location.search) || /\/learn\/?$/.test(location.pathname);

  /* The practice board is fixed, so the coaching can be written for it: six
     taps, and exactly one tile two turns off so "one more turn" happens once.
     Verified: par 6, tile 6 is the two-turn one, solved reaches all nine. */
  var LEARN_BOARD = {
    n: 3,
    masks: [2, 14, 12, 4, 1, 5, 3, 10, 9],
    turns: [3, 0, 3, 0, 3, 0, 2, 0, 3],
    source: 4
  };

  var state = { n: 6, masks: [], turns: [], source: 0, moves: 0, done: false, focus: 0 };
  var tiles = [];

  /* ---- storage --------------------------------------------------------- */
  /* Every call is wrapped: a private window throws on access, and losing a
     saved board is never worth losing the game over. */
  var KEY = {
    board: "pp_trickle_board",   /* the board in play; "" once finished */
    done: "pp_trickle_done",     /* boards finished */
    bySize: "pp_trickle_by_size",
    stats: "pp_trickle_stats",
    size: "pp_trickle_size",
    sound: "pp_trickle_sound",
    night: "pp_trickle_night",   /* unset means follow the clock */
    music: "pp_trickle_music"
  };
  function read(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function write(key, value) {
    try {
      window.localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    } catch (e) { /* nothing to do, and nothing worth breaking for */ }
  }

  var stats = read(KEY.stats, null) || { total_turns: 0, nudges: 0, best_turns: {}, last_played: null };
  if (!stats.best_turns) stats.best_turns = {};

  /* ---- account sync ---------------------------------------------------- */
  /* Same origin as the app, so the session it already holds is right here.
     Signing in must never make things worse, so nothing is ever replaced --
     the two sides are merged and the better half of each pair wins. */
  var SB_URL = "https://ixagjvntbgyqemxxinqe.supabase.co";
  var SB_KEY = "sb_publishable__A5fA6nyI8nrSqJWfaaJBQ_vqEZdRn6";
  var SB_SESSION_KEY = "sb-ixagjvntbgyqemxxinqe-auth-token";
  var SIGN_IN_URL = "/account";

  var bigger = function (a, b) { return Math.max(a | 0, b | 0); };

  /**
   * Merge what is on this device with what the account holds.
   * Counts and totals take the larger; fewest-turns takes the smaller; a
   * board nobody has touched never displaces one somebody played.
   */
  function mergeProgress(local, remote) {
    if (!remote) return local;
    var out = {
      done: bigger(local.done, remote.boards_finished),
      bySize: {},
      stats: {
        total_turns: bigger(local.stats.total_turns, (remote.stats || {}).total_turns),
        nudges: bigger(local.stats.nudges, (remote.stats || {}).nudges),
        best_turns: {},
        last_played: null
      },
      board: null
    };

    var sizes = {}, rBySize = remote.boards_by_size || {};
    Object.keys(local.bySize || {}).forEach(function (k) { sizes[k] = 1; });
    Object.keys(rBySize).forEach(function (k) { sizes[k] = 1; });
    Object.keys(sizes).forEach(function (k) {
      out.bySize[k] = bigger((local.bySize || {})[k], rBySize[k]);
    });

    /* Fewest turns is the one number where smaller wins. */
    var lBest = local.stats.best_turns || {}, rBest = (remote.stats || {}).best_turns || {}, bests = {};
    Object.keys(lBest).forEach(function (k) { bests[k] = 1; });
    Object.keys(rBest).forEach(function (k) { bests[k] = 1; });
    Object.keys(bests).forEach(function (k) {
      var a = lBest[k], b = rBest[k];
      out.stats.best_turns[k] = a == null ? b : b == null ? a : Math.min(a, b);
    });

    var lPlayed = local.stats.last_played, rPlayed = (remote.stats || {}).last_played;
    out.stats.last_played = !lPlayed ? rPlayed : !rPlayed ? lPlayed : (lPlayed > rPlayed ? lPlayed : rPlayed);

    /* A board just dealt on load has no moves in it; it must not push aside
       one somebody actually played on another device. */
    var lb = local.board && local.board.moves > 0 ? local.board : null;
    var rb = remote.current_board && remote.current_board.moves > 0 ? remote.current_board : null;
    if (lb && rb) out.board = (lb.saved_at || "") >= (rb.saved_at || "") ? lb : rb;
    else out.board = lb || rb || local.board || remote.current_board || null;
    return out;
  }

  /* The session the app already put in localStorage. Signed out, this is
     null and nothing is ever sent. */
  function session() {
    var raw = read(SB_SESSION_KEY, null);
    return raw && raw.access_token && raw.user && raw.user.id ? raw : null;
  }

  /* An expired token is refreshed and written back in the same shape, so the
     app picks up the refreshed session too. */
  async function token() {
    var s = session();
    if (!s) return null;
    var now = Math.floor(Date.now() / 1000);
    if (!s.expires_at || s.expires_at - 60 > now) return s.access_token;
    try {
      var res = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { apikey: SB_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!res.ok) return null;
      var next = await res.json();
      if (!next.access_token) return null;
      write(SB_SESSION_KEY, next);
      return next.access_token;
    } catch (e) { return null; }
  }

  function localProgress() {
    return {
      done: read(KEY.done, 0) | 0,
      bySize: read(KEY.bySize, {}) || {},
      stats: stats,
      board: storedBoard()
    };
  }

  /* Whatever the merge decided is what both sides end up holding. */
  function applyProgress(merged) {
    write(KEY.done, merged.done);
    write(KEY.bySize, merged.bySize);
    stats = merged.stats;
    write(KEY.stats, stats);
    showRecords();
  }

  async function pushProgress() {
    var access = await token();
    if (!access) return;
    var p = localProgress();
    try {
      await fetch(SB_URL + "/rest/v1/game_progress", {
        method: "POST",
        headers: {
          apikey: SB_KEY,
          Authorization: "Bearer " + access,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify({
          user_id: session().user.id,
          boards_finished: p.done,
          boards_by_size: p.bySize,
          current_board: p.board,
          stats: p.stats,
          updated_at: new Date().toISOString()
        })
      });
    } catch (e) { /* the local copy is still right; try again next time */ }
  }

  /* Board saves are debounced; a finished board goes at once. */
  var pushTimer = null;
  function schedulePush(immediate) {
    if (!session()) return;
    if (pushTimer) clearTimeout(pushTimer);
    if (immediate) { pushProgress(); return; }
    pushTimer = setTimeout(function () { pushTimer = null; pushProgress(); }, 1500);
  }

  async function pullProgress() {
    var access = await token();
    if (!access) { showSaveLine(); return; }
    try {
      var res = await fetch(
        SB_URL + "/rest/v1/game_progress?select=*&user_id=eq." + encodeURIComponent(session().user.id),
        { headers: { apikey: SB_KEY, Authorization: "Bearer " + access } }
      );
      if (!res.ok) { showSaveLine(); return; }
      var rows = await res.json();
      var merged = mergeProgress(localProgress(), rows && rows[0]);
      applyProgress(merged);
      /* A board from another device is only taken up when nothing is in play
         here, so it can never interrupt a game mid-turn. */
      if (merged.board && !state.done && state.moves === 0 && !LEARN) {
        if (merged.board.n && merged.board.moves > 0) {
          write(KEY.board, merged.board);
          build(merged.board.n, merged.board);
        }
      }
      showSaveLine();
      pushProgress();
    } catch (e) { showSaveLine(); }
  }

  function showSaveLine() {
    var el = document.getElementById("save");
    if (LEARN) { el.textContent = ""; return; }
    el.innerHTML = session()
      ? "Saved to your account."
      : '<a href="' + SIGN_IN_URL + '">Sign in</a> to keep your progress across devices.';
  }

  /* ---- sound ----------------------------------------------------------- */
  /* Everything is synthesised: nothing to download, nothing to fail. A
     browser only starts audio after a gesture, so the context is created on
     the first tap and a suspended one is resumed. */
  var AC = null, master = null, analyser = null, wet = null;
  var soundOn = read(KEY.sound, false) === true;
  var musicPref = read(KEY.music, null);          /* null: never chosen */
  var musicOn = false, musicTimer = null, step16 = 0, nextNoteAt = 0, pass = 0;

  var BPM = 66, STEP = 60 / BPM / 2, D3 = 146.83;
  /* One dial for the whole mix. The spec's reference measures peak 0.30 and
     mean RMS 0.06 on the master bus; the first pass here came out at 0.068
     and 0.015, which is on but inaudible. Tuned against the analyser rather
     than by ear, since there is no ear in a test run. */
  var MIX = 4;
  var MOTIF = [19, 16, 14, 12, 14, 16, 19, 21, 19, 16, 14, 12, null, 14, 12, null];
  var CHORDS = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]];   /* D Bm G A */
  var BLIPS = [329.63, 392, 440, 523.25, 587.33];
  var hz = function (semi) { return D3 * Math.pow(2, semi / 12); };

  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { AC = new Ctor(); } catch (e) { return null; }
    master = AC.createGain();
    master.gain.value = 1;
    /* A delay alongside the dry signal, then a low-pass, so nothing is
       sharp enough to jar. */
    var lp = AC.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1600; lp.Q.value = 0.4;
    var delay = AC.createDelay(1);
    delay.delayTime.value = 0.41;
    var fb = AC.createGain(); fb.gain.value = 0.32;
    wet = AC.createGain(); wet.gain.value = 0.28;
    master.connect(lp);
    master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(lp);
    analyser = AC.createAnalyser();
    analyser.fftSize = 2048;
    lp.connect(analyser);
    analyser.connect(AC.destination);
    return AC;
  }
  function wake() {
    var ac = audio();
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }

  function blip(i) {
    if (!soundOn) return;
    var ac = wake(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = "sine";
    o.frequency.value = BLIPS[i % BLIPS.length];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05 * MIX, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.25);
  }
  function fanfare() {
    if (!soundOn) return;
    var ac = wake(); if (!ac) return;
    [0, 1, 2, 3].forEach(function (k) {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + k * 0.11;
      o.type = "sine";
      o.frequency.value = BLIPS[k + 1] || BLIPS[BLIPS.length - 1];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.06 * MIX, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.4);
    });
  }

  /* One voice: an oscillator with a slow swell, so nothing ever clicks. */
  function voice(type, frequency, at, dur, peak, attack, detune) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.value = frequency;
    if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.05);
  }

  /* Scheduled half a second ahead on a short interval: WebAudio keeps time,
     setInterval only decides what to hand it. */
  function schedule() {
    if (!musicOn || !AC) return;
    while (nextNoteAt < AC.currentTime + 0.5) {
      var at = Math.max(nextNoteAt, AC.currentTime + 0.02);
      var semi = MOTIF[step16];
      if (semi != null) {
        voice("sine", hz(semi), at, 0.9, 0.05 * MIX, 0.02, 0);
        /* Every fourth pass answers an octave up, quieter. */
        if (pass % 4 === 3) voice("sine", hz(semi + 12), at, 0.7, 0.022 * MIX, 0.02, 0);
        /* And now and then a fifth above, a half-step behind, as a glint. */
        if (Math.random() < 0.08) voice("sine", hz(semi + 19), at + 0.5 * STEP, 0.5, 0.018 * MIX, 0.02, 0);
      }
      if (step16 === 0) {
        var chord = CHORDS[(pass % CHORDS.length + CHORDS.length) % CHORDS.length];
        var bar = STEP * 16;
        chord.forEach(function (n) {
          voice("triangle", hz(n), at, bar, 0.016 * MIX, 1.6, 5);
          voice("triangle", hz(n), at, bar, 0.016 * MIX, 1.6, -5);
        });
        voice("sine", hz(chord[0] - 12), at, bar, 0.03 * MIX, 0.6, 0);
      }
      nextNoteAt = at + STEP;
      step16 += 1;
      if (step16 === 16) { step16 = 0; pass += 1; }
    }
  }

  function startMusic() {
    var ac = wake(); if (!ac) return;
    if (musicOn) return;
    musicOn = true;
    step16 = 0; pass = 0;
    nextNoteAt = ac.currentTime + 0.1;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), ac.currentTime);
    master.gain.linearRampToValueAtTime(1, ac.currentTime + 2.5);
    musicTimer = setInterval(schedule, 120);
    schedule();
  }
  function stopMusic() {
    musicOn = false;
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (AC && master) {
      master.gain.cancelScheduledValues(AC.currentTime);
      master.gain.setValueAtTime(master.gain.value, AC.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, AC.currentTime + 1.2);
      setTimeout(function () { if (!musicOn && master) master.gain.value = 1; }, 1300);
    }
  }

  /* A tab nobody is looking at should be silent. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    } else if (musicOn && !musicTimer) {
      if (AC) nextNoteAt = AC.currentTime + 0.1;
      musicTimer = setInterval(schedule, 120);
    }
  });

  function saveBoard() {
    if (state.done) return;
    write(KEY.board, {
      n: state.n, masks: state.masks, turns: state.turns,
      source: state.source, moves: state.moves, saved_at: new Date().toISOString()
    });
    schedulePush(false);
  }

  /* A stored board is only usable if it is internally consistent; anything
     older or half-written is dropped rather than half-restored. */
  function storedBoard() {
    var b = read(KEY.board, null);
    if (!b || [4, 6, 8].indexOf(b.n) === -1) return null;
    var total = b.n * b.n;
    if (!Array.isArray(b.masks) || b.masks.length !== total) return null;
    if (!Array.isArray(b.turns) || b.turns.length !== total) return null;
    if (typeof b.source !== "number" || b.source < 0 || b.source >= total) return null;
    if (typeof b.moves !== "number" || b.moves < 0) return null;
    return b;
  }
  function liveMask(i) { return rotate(state.masks[i], state.turns[i]); }

  /* ---- board: randomized DFS spanning tree ----------------------------- */
  /* Every cell joins the network once, so the board is always solvable and
     "all aligned" and "all flowing" are the same condition. DFS rather than
     Prim/Kruskal because it makes long corridors instead of a thicket. */
  function buildMasks(n, rnd) {
    rnd = rnd || Math.random;
    var total = n * n, masks = new Array(total).fill(0), seen = new Array(total).fill(false);
    var start = (rnd() * total) | 0, stack = [start];
    seen[start] = true;
    while (stack.length) {
      var cur = stack[stack.length - 1], x = cur % n, y = (cur / n) | 0, options = [];
      for (var i = 0; i < 4; i++) {
        var d = DIRS[i], nx = x + d.dx, ny = y + d.dy;
        if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
        var idx = ny * n + nx;
        if (!seen[idx]) options.push([d, idx]);
      }
      if (!options.length) { stack.pop(); continue; }
      var pick = options[(rnd() * options.length) | 0];
      masks[cur] |= pick[0].bit;
      masks[pick[1]] |= pick[0].opp;
      seen[pick[1]] = true;
      stack.push(pick[1]);
    }
    return masks;
  }

  /* Only rotations that visibly change the tile, so "misaligned" is honest:
     a straight has two states, a cross has one. */
  function scramble(masks, rnd) {
    rnd = rnd || Math.random;
    return masks.map(function (m) {
      var choices = [];
      for (var r = 0; r < 4; r++) if (r === 0 || rotate(m, r) !== m) choices.push(r);
      return choices[(rnd() * choices.length) | 0];
    });
  }

  function parOf(masks, turns) {
    var par = 0;
    for (var i = 0; i < masks.length; i++) {
      var r = 0;
      while (r < 4 && rotate(masks[i], turns[i] + r) !== masks[i]) r++;
      par += r;
    }
    return par;
  }

  /* ---- flow: BFS from the source -------------------------------------- */
  /* Water crosses only where both halves meet. */
  function computeFlow() {
    var n = state.n, flowing = new Array(n * n).fill(false), queue = [state.source];
    flowing[state.source] = true;
    while (queue.length) {
      var cur = queue.pop(), x = cur % n, y = (cur / n) | 0, mask = liveMask(cur);
      for (var i = 0; i < 4; i++) {
        var d = DIRS[i];
        if (!(mask & d.bit)) continue;
        var nx = x + d.dx, ny = y + d.dy;
        if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
        var idx = ny * n + nx;
        if (flowing[idx] || !(liveMask(idx) & d.opp)) continue;
        flowing[idx] = true;
        queue.push(idx);
      }
    }
    return flowing;
  }

  /* ---- art ------------------------------------------------------------- */
  /* Drawn once in the tile's SOLVED orientation; the live rotation is only a
     CSS transform, so the animation always spins the same way. */
  function svgFor(mask, isSource) {
    var arms = "", count = 0;
    for (var i = 0; i < 4; i++) {
      var d = DIRS[i];
      if (!(mask & d.bit)) continue;
      count++;
      arms += "M50 50L" + (50 + d.dx * 50) + " " + (50 + d.dy * 50);
    }
    var svg = '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">';
    svg += '<g class="pipe"><path d="' + arms + '"/></g>';
    svg += '<g class="flow"><path d="' + arms + '"/></g>';
    /* A dead end gets a rounded stop so it does not look unfinished. */
    if (count === 1) svg += '<circle class="cap" cx="50" cy="50" r="13"/>';
    if (isSource) svg += '<circle class="valve" cx="50" cy="50" r="13"/>';
    return svg + "</svg>";
  }

  /* ---- rendering ------------------------------------------------------- */
  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var litEl = document.getElementById("lit");
  var winEl = document.getElementById("win");
  var winLine = document.getElementById("win-line");

  function build(n, restored) {
    if (LEARN) {
      state.n = LEARN_BOARD.n;
      state.masks = LEARN_BOARD.masks.slice();
      state.turns = LEARN_BOARD.turns.slice();
      state.source = LEARN_BOARD.source;
      state.moves = 0;
      n = state.n;
    } else if (restored) {
      state.n = restored.n;
      state.masks = restored.masks.slice();
      state.turns = restored.turns.slice();
      state.source = restored.source;
      state.moves = restored.moves;
      n = state.n;
    } else {
      state.n = n;
      state.masks = buildMasks(n);
      do { state.turns = scramble(state.masks); } while (parOf(state.masks, state.turns) === 0);
      /* Nearest the middle, so the water spreads outward rather than creeping
         in from a corner. */
      var mid = (n / 2) | 0;
      state.source = mid * n + mid;
      state.moves = 0;
    }
    state.done = false;
    state.focus = state.source;
    if (!LEARN) write(KEY.size, n);

    board.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    board.dataset.n = String(n);
    board.innerHTML = "";
    tiles = [];
    for (var i = 0; i < n * n; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tile";
      b.dataset.i = String(i);
      b.innerHTML = svgFor(state.masks[i], i === state.source);
      board.appendChild(b);
      tiles.push(b);
    }
    winEl.hidden = true;
    paint();
    if (LEARN) coach("Tap a pipe to turn it a quarter turn. The glowing one is next to join.");
    else if (!restored) saveBoard();
  }

  /* One line of coaching, which only practice ever shows. */
  var coachEl = document.getElementById("coach");
  var coachLine = document.getElementById("coach-line");
  function coach(text) {
    coachLine.textContent = text;
    coachEl.hidden = !LEARN;
  }

  /* The next pipe worth turning: a misaligned tile that, straightened, gets
     the water further than it is now. Tested by actually straightening it and
     counting.
     
     Counting rather than asking whether that tile ends up flowing: the source
     is always flowing, so "does it flow" says yes for the source whatever it
     is pointing at, and the first move on the practice board is the source. */
  function hintTile() {
    var reach = computeFlow().filter(Boolean).length;
    for (var i = 0; i < state.masks.length; i++) {
      if (liveMask(i) === state.masks[i]) continue;
      var was = state.turns[i], r = 0;
      while (r < 4 && rotate(state.masks[i], state.turns[i] + r) !== state.masks[i]) r++;
      state.turns[i] += r;
      var gained = computeFlow().filter(Boolean).length > reach;
      state.turns[i] = was;
      if (gained) return i;
    }
    return -1;
  }

  function paint() {
    var flowing = computeFlow(), n = state.n, lit = 0;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i], svg = t.firstChild;
      svg.style.transform = "rotate(" + state.turns[i] * 90 + "deg)";
      if (flowing[i]) { t.classList.add("flowing"); lit++; } else { t.classList.remove("flowing"); }
      t.tabIndex = i === state.focus ? 0 : -1;
      var row = ((i / n) | 0) + 1, col = (i % n) + 1;
      t.setAttribute(
        "aria-label",
        "Row " + row + ", column " + col + ", " +
        (i === state.source ? "water valve, " : "") +
        (flowing[i] ? "flowing" : "dry") + ". Press Enter to turn."
      );
    }
    movesEl.textContent = String(state.moves);
    litEl.textContent = lit + " of " + tiles.length;
    showRecords();
    if (LEARN && !state.done) {
      var hint = hintTile();
      for (var h = 0; h < tiles.length; h++) tiles[h].classList.toggle("hint", h === hint);
    }
    if (!state.done && lit === tiles.length) finish();
  }

  /* Finishing is the only place the counters move. */
  function finish() {
    state.done = true;
    var n = state.n;
    if (LEARN) {
      for (var h = 0; h < tiles.length; h++) tiles[h].classList.remove("hint");
      coach("That is the whole game. No timer, no score, and boards you cannot lose.");
      winLine.textContent = "Six turns, and the water reached every plant.";
      document.getElementById("win-tally").textContent =
        "Practice does not count towards anything. Ready for a real board?";
      document.getElementById("again").textContent = "Play a board";
      winEl.hidden = false;
      fanfare();
      return;
    }
    var previousBest = stats.best_turns[n];
    var isBest = previousBest == null || state.moves < previousBest;

    var done = (read(KEY.done, 0) | 0) + 1;
    var bySize = read(KEY.bySize, {}) || {};
    bySize[n] = (bySize[n] | 0) + 1;
    stats.total_turns += state.moves;
    if (isBest) stats.best_turns[n] = state.moves;
    stats.last_played = new Date().toISOString();
    write(KEY.done, done);
    write(KEY.bySize, bySize);
    write(KEY.stats, stats);
    write(KEY.board, "");   /* nothing in play any more */
    schedulePush(true);     /* a finished board does not wait */

    winLine.textContent =
      n + "×" + n + " in " + state.moves + (state.moves === 1 ? " turn" : " turns") + ".";
    var tally = document.getElementById("win-tally");
    var boards = done === 1 ? "Your first board." : done + " boards finished.";
    if (isBest && previousBest != null) {
      tally.innerHTML = '<span class="best">A new best at this size</span> — ' +
        previousBest + " before. " + boards;
    } else if (isBest) {
      tally.textContent = boards;
    } else {
      tally.textContent = "Your best at this size is " + previousBest + ". " + boards;
    }
    winEl.hidden = false;
    showRecords();
    fanfare();
  }

  /* The only two numbers worth keeping: fewest turns here, boards finished. */
  function showRecords() {
    var recordsEl = document.getElementById("records");
    var best = stats.best_turns[state.n], done = read(KEY.done, 0) | 0, bits = [];
    if (best != null) bits.push("Best at " + state.n + "×" + state.n + " <b>" + best + "</b>");
    if (done > 0) bits.push("Finished <b>" + done + "</b>");
    recordsEl.innerHTML = bits.join(" · ");
    recordsEl.hidden = bits.length === 0;
  }

  /* ---- turning --------------------------------------------------------- */
  function turn(i) {
    if (state.done) return;
    /* A cross looks the same every way up, so turning it is not a move. */
    if (rotate(state.masks[i], 1) === state.masks[i]) return;
    var wanted = LEARN ? hintTile() : -1;
    blip(i);
    if (musicShouldPlay() && !musicOn) startMusic();   /* a remembered choice, waiting for a tap */
    state.turns[i] += 1;
    state.moves += 1;
    state.focus = i;
    if (LEARN && !state.done) {
      if (i !== wanted) {
        coach("That one can wait — it is not where the water is. Try the glowing pipe.");
      } else if (liveMask(i) === state.masks[i]) {
        coach("That's it. The water moved on.");
      } else {
        coach("Nearly — that one needs one more turn.");
      }
    }
    paint();
    if (!LEARN) saveBoard();
  }

  /* Straighten one tile, free. Prefers a tile the water already touches, so
     the board opens from where the player is looking. */
  function nudge() {
    if (state.done) return;
    var flowing = computeFlow(), all = [], near = [], n = state.n;
    for (var i = 0; i < state.masks.length; i++) {
      if (liveMask(i) === state.masks[i]) continue;
      all.push(i);
      if (flowing[i]) { near.push(i); continue; }
      var x = i % n, y = (i / n) | 0;
      for (var k = 0; k < 4; k++) {
        var d = DIRS[k], nx = x + d.dx, ny = y + d.dy;
        if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
        if (flowing[ny * n + nx]) { near.push(i); break; }
      }
    }
    var pool = near.length ? near : all;
    if (!pool.length) return;
    var pick = pool[(Math.random() * pool.length) | 0];
    var r = 0;
    while (r < 4 && rotate(state.masks[pick], state.turns[pick] + r) !== state.masks[pick]) r++;
    state.turns[pick] += r;
    state.moves += 1;   /* one turn, however far it had to go */
    state.focus = pick;
    if (!LEARN) { stats.nudges += 1; write(KEY.stats, stats); }
    paint();
    if (!LEARN) saveBoard();
  }

  /* ---- input ----------------------------------------------------------- */
  board.addEventListener("click", function (e) {
    var t = e.target.closest(".tile");
    if (t) turn(Number(t.dataset.i));
  });

  /* Roving tabindex: one stop for the grid, arrows to move inside it. */
  board.addEventListener("keydown", function (e) {
    var map = { ArrowUp: -state.n, ArrowDown: state.n, ArrowLeft: -1, ArrowRight: 1 };
    if (!(e.key in map)) return;
    var n = state.n, i = state.focus, x = i % n, y = (i / n) | 0;
    if (e.key === "ArrowLeft" && x === 0) return;
    if (e.key === "ArrowRight" && x === n - 1) return;
    var next = i + map[e.key];
    if (next < 0 || next >= n * n) return;
    e.preventDefault();
    state.focus = next;
    tiles[next].focus();
    paint();
  });

  document.querySelectorAll("[data-size]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("[data-size]").forEach(function (o) { o.classList.remove("on"); });
      b.classList.add("on");
      build(Number(b.dataset.size));
    });
  });
  document.getElementById("new").addEventListener("click", function () { build(state.n); });
  document.getElementById("nudge").addEventListener("click", nudge);
  document.getElementById("again").addEventListener("click", function () { build(state.n); });

  /* ---- night ----------------------------------------------------------- */
  /* Unset follows the clock, so the first evening visit is already dark
     without anybody choosing. Choosing once wins from then on. */
  function clockSaysNight() {
    var h = new Date().getHours();
    return h >= 21 || h < 6;
  }
  var nightPref = read(KEY.night, null);
  function nightIsOn() { return nightPref == null ? clockSaysNight() : nightPref === true; }
  function applyNight() {
    var on = nightIsOn();
    document.body.classList.toggle("night", on);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", on ? "#140A17" : "#2E1633");
    document.getElementById("night").classList.toggle("on", on);
    document.getElementById("night").setAttribute("aria-pressed", String(on));
  }

  function setToggle(id, on) {
    var b = document.getElementById(id);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  }

  /* Music follows Night unless somebody has turned it off on purpose. It
     cannot start without a gesture, so a remembered preference waits for the
     first tap rather than failing silently. */
  function musicShouldPlay() { return musicPref === true || (musicPref == null && nightIsOn()); }
  function refreshMusic(fromGesture) {
    var want = musicShouldPlay();
    setToggle("music", want);
    if (want && fromGesture) startMusic();
    else if (!want && musicOn) stopMusic();
  }

  document.getElementById("sound").addEventListener("click", function () {
    soundOn = !soundOn;
    write(KEY.sound, soundOn);
    setToggle("sound", soundOn);
    if (soundOn) blip(0);
  });
  document.getElementById("music").addEventListener("click", function () {
    musicPref = !musicShouldPlay();
    write(KEY.music, musicPref);
    refreshMusic(true);
  });
  document.getElementById("night").addEventListener("click", function () {
    nightPref = !nightIsOn();
    write(KEY.night, nightPref);
    applyNight();
    refreshMusic(true);
  });

  applyNight();
  setToggle("sound", soundOn);
  setToggle("music", musicShouldPlay());

  /* Practice has no sizes, no new board and no way back into itself. */
  function setChrome() {
    document.querySelector(".sizes").hidden = LEARN;
    document.getElementById("new").hidden = LEARN;
    document.getElementById("learn-link").hidden = LEARN;
    coachEl.hidden = !LEARN;
  }

  /* Finishing practice hands over to a real board and puts the URL back, so
     a reload afterwards does not drop the player into practice again. */
  document.getElementById("again").addEventListener("click", function () {
    if (!LEARN) return;
    LEARN = false;
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* fine */ }
    document.getElementById("again").textContent = "Another board";
    setChrome();
    var size = (read(KEY.size, 6) | 0) || 6;
    if ([4, 6, 8].indexOf(size) === -1) size = 6;
    var btn = document.querySelector('[data-size="' + size + '"]');
    if (btn) { document.querySelectorAll("[data-size]").forEach(function (o) { o.classList.remove("on"); }); btn.classList.add("on"); }
    build(size);
  });

  setChrome();
  if (LEARN) {
    build(3);
  } else {
    /* Resume whatever was in play; otherwise the size last chosen. */
    var resume = storedBoard();
    var startSize = resume ? resume.n : (read(KEY.size, 6) | 0) || 6;
    if ([4, 6, 8].indexOf(startSize) === -1) startSize = 6;
    var sizeBtn = document.querySelector('[data-size="' + startSize + '"]');
    if (sizeBtn) sizeBtn.classList.add("on");
    build(startSize, resume);
  }
  showSaveLine();
  if (!LEARN) pullProgress();

  /* The test script drives the page; it needs to see the state. */
  /* The test needs to measure the bus rather than take its level on trust. */
  window.__game = {
    state: state, liveMask: liveMask, computeFlow: computeFlow, mergeProgress: mergeProgress,
    musicPlaying: function () { return musicOn && !!musicTimer; },
    levels: function () {
      if (!analyser) return null;
      var buf = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buf);
      var peak = 0, sum = 0;
      for (var i = 0; i < buf.length; i++) { var v = Math.abs(buf[i]); if (v > peak) peak = v; sum += buf[i] * buf[i]; }
      return { peak: peak, rms: Math.sqrt(sum / buf.length) };
    }
  };
})();
</script>
</body>
</html>
