<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E1633">
<title>Windowsill — a calm light puzzle</title>
<meta name="description" content="Arrange the plants on a stepped windowsill so every one of them gets the light it wants. No timers, no scores, nothing to lose. From PlantParlour.">
<link rel="canonical" href="https://plantparlour.org/parlour-games/windowsill">
<style>
/*
 * Windowsill, step 1: the shelf, the rules, and nothing else. One fixed
 * board, no generator, no daily, no sound, no account.
 *
 * The geometry is the game, so it is worth saying plainly: --unit is BOTH
 * the height of one step of the stand and the height of one unit of plant.
 * They have to be the same number. A low plant (one unit) standing on the
 * front tier reaches exactly the height of the next tier's floor and so
 * shades nothing, which is the rule the whole puzzle turns on -- and if the
 * two measurements drifted apart, the picture would say one thing and the
 * rules another.
 */
:root{
  --ink:#2E1633;
  --card:#3A1C41;
  --border:rgba(201,162,75,.32);
  --edge:rgba(201,162,75,.6);
  --gold:#C9A24B;
  --gold-light:#E6C46B;
  --cream:#F3ECDD;
  --muted:#C8B8C2;
  --leaf:#8FC79E;
  --unit:22px;          /* one step of the stand == one unit of plant */
  --sun:#E6C46B;
  --bright:#9FD3AC;
  --shade:#6FA9A0;
  --bad:#E08BA6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream)}
body{
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;padding:24px 16px 48px;
  -webkit-font-smoothing:antialiased;
}
main{max-width:520px;margin:0 auto}
h1{font-family:Lora,Georgia,"Times New Roman",serif;font-weight:700;font-size:30px;margin:0;text-align:center}
.tagline{font-family:Lora,Georgia,serif;font-style:italic;color:var(--muted);margin:6px 0 0;text-align:center;font-size:16px}
.hub{text-align:center;font-size:14px;margin:14px 0 0}
.hub a{color:var(--gold-light)}

/* ---- how big a shelf ---- */
/* The three shapes are the difficulty, and they are measured rather than
   named by feel: each one deals boards with a set number of ways out. */
/* ---- practice ---- */
/* Its own voice: a line that answers whatever just happened, in the place
   the eye already is. Lora, so it reads as somebody talking rather than as
   part of the machinery. */
#coach{
  margin:16px 0 0;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:13px 16px;font-family:Lora,Georgia,serif;
  font-size:15px;line-height:1.45;color:var(--cream);min-height:3.4em;
}
body.learn .shelves,body.learn #new{display:none}

.shelves{display:flex;gap:8px;justify-content:center;margin:16px 0 0}
.shelves button{
  background:none;border:1px solid var(--border);border-radius:9px;
  color:var(--muted);font:inherit;font-size:14px;padding:8px 14px;
  min-height:44px;cursor:pointer;
}
.shelves button.on{border-color:var(--gold);color:var(--gold-light);font-weight:700}
.shelves button:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
.actions{display:flex;gap:8px;white-space:nowrap}

/* ---- the shelf ---- */
/* Light comes in from the left, so a "run" is a row: one line of cells going
   back from the glass, and the runs are independent of each other.
   The stand is drawn as one continuous staircase with no gaps between the
   cells, because the question a player has to be able to answer by looking
   is "does this plant's head clear the step behind it" -- and separate boxes
   with air between them make that exactly the thing you cannot see. */
#shelf{margin:22px 0 0;display:grid;gap:14px}
.run{display:flex;align-items:flex-end;gap:0;border-radius:6px;overflow:hidden}
.glass{
  width:16px;align-self:stretch;flex:none;
  background:linear-gradient(100deg,#F6E7B4,rgba(246,231,180,.12));
  box-shadow:0 0 22px rgba(230,196,107,.4);
}
.cell{
  flex:1;position:relative;display:block;padding:0;min-width:0;
  height:calc(var(--unit) * 5 + 46px);
  background:none;border:none;color:inherit;font:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* One step of the stand. No side borders, so the three of them read as a
   single piece of furniture rather than three pedestals. */
.plinth{
  position:absolute;left:0;right:0;bottom:0;
  background:#3A1C41;border-top:2px solid var(--edge);
}
.cell:focus-visible{outline:2px solid var(--gold-light);outline-offset:-2px;border-radius:4px}
.cell[data-held="1"] .plinth{background:#5A2A50;border-top-color:var(--gold)}

/* The plant stands ON its step, so its foot is that step's top edge and its
   head is (tier + height) units up -- which is exactly what the rule
   measures. A pot and a rounded crown, so a plant never reads as furniture. */
.plant{position:absolute;left:27%;right:27%;display:flex;flex-direction:column;justify-content:flex-end}
/* `hidden` sets display:none from the UA sheet, which an author display:flex
   silently beats -- so an empty cell drew an empty pot until this was here. */
.plant[hidden]{display:none}
.crown{
  border-radius:40% 40% 18% 18%;background:var(--leaf);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);
}
.pot{height:9px;margin:0 16%;border-radius:0 0 5px 5px;background:#8A5A3B;flex:none}
.plant[data-need="3"] .crown{background:var(--sun)}
.plant[data-need="2"] .crown{background:var(--bright)}
.plant[data-need="1"] .crown{background:var(--shade)}
/* What the plant wants, said above it rather than written on it: a low plant
   is one unit tall and there is simply no room on it for a word. */
.want{
  position:absolute;top:16px;left:0;right:0;text-align:center;
  font-size:11px;font-weight:700;color:var(--cream);
}
.want i{font-style:normal;font-size:12px}
/* Light reaching this cell, as pips, at the top. */
.pips{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:var(--gold-light)}
.pips b{opacity:.2;font-weight:400}
/* How the plant is doing. Symbol and word, never colour alone. */
.verdict{position:absolute;top:32px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;line-height:1.2}
.verdict.happy{color:var(--leaf)}
.verdict.scorching,.verdict.leggy{color:var(--bad)}
/* Sits on the step it belongs to, not floating in the middle of the cell. */
.empty-label{position:absolute;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);opacity:.55;text-transform:uppercase;letter-spacing:.08em}

/* ---- the tray ---- */
h2{font-family:Lora,Georgia,serif;font-size:17px;margin:24px 0 8px}
#tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px}
.chip{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;min-height:44px;color:inherit;font:inherit;cursor:pointer;
}
.chip[data-held="1"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.chip:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
.swatch{width:10px;border-radius:3px;flex:none}
.chip[data-need="3"] .swatch{background:var(--sun)}
.chip[data-need="2"] .swatch{background:var(--bright)}
.chip[data-need="1"] .swatch{background:var(--shade)}
.chip small{color:var(--muted);font-size:12px}
#tray-empty{color:var(--muted);font-size:14px;margin:0;align-self:center}

/* Wraps rather than squeezing: at 390px with two buttons in it, "9
   placements · par 15" was breaking across two lines mid-phrase. */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 12px;margin-top:18px;font-size:14px;color:var(--muted)}
.bar #moves{white-space:nowrap}
.actions{margin-left:auto}
/* Always there, because taking the whole thing apart and starting over is a
   normal thing to want and should not need finishing first. */
button.quiet{
  background:none;border:1px solid var(--border);border-radius:9px;
  color:var(--gold-light);font:inherit;font-size:13px;padding:6px 12px;
  min-height:36px;cursor:pointer;
}
button.quiet:hover{border-color:var(--gold)}
button.quiet:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
#status{margin:10px 0 0;font-size:14px;color:var(--muted);min-height:1.5em}
#win{
  margin-top:18px;background:var(--card);border:1px solid var(--edge);
  border-radius:14px;padding:18px;text-align:center;
}
#win h2{margin:0 0 6px;font-size:22px;color:var(--gold-light)}
#win p{margin:0;color:var(--muted);font-size:15px}
button.plain{
  margin-top:14px;background:var(--gold);color:var(--ink);border:none;
  border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;
}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:26px 0 0}
.foot a{color:var(--gold-light)}
@media (prefers-reduced-motion: no-preference){
  .stem{transition:height .18s ease}
}
</style>
</head>
<body>
<main>
  <h1>Windowsill</h1>
  <p class="tagline">Give every plant the light it actually wants.</p>
  <p class="hub"><a href="/parlour-games">← Parlour Games</a><span id="learn-link"> · <a href="?learn=1">How to play</a></span></p>

  <p id="coach" hidden><span id="coach-line"></span></p>

  <div class="shelves" role="group" aria-label="How big a shelf">
    <button type="button" data-shelf="gentle">Gentle</button>
    <button type="button" data-shelf="standard">Standard</button>
    <button type="button" data-shelf="deep">Deep end</button>
  </div>

  <div id="shelf"></div>

  <div class="bar">
    <span id="moves">0 placed</span>
    <span class="actions">
      <button class="quiet" id="clear" type="button">Clear the shelf</button>
      <button class="quiet" id="new" type="button">New board</button>
    </span>
  </div>
  <p id="status"></p>

  <h2>Still to go in</h2>
  <div id="tray"></div>

  <div id="win" hidden>
    <h2>Every one of them is happy.</h2>
    <p id="win-line"></p>
    <button class="plain" id="again" type="button">Start again</button>
  </div>

  <p class="foot">A quiet puzzle from <a href="/">PlantParlour</a>.</p>
</main>

<script src="/parlour-games/harness.js"></script>
<script src="/parlour-games/windowsill-rules.js"></script>
<script>
(function () {
  "use strict";
  var R = window.WindowsillRules;
  /* The arcade's: the seeded generator, and the storage wrappers that survive
     a browser with everything switched off. */
  var P = window.Parlour;
  var KEY = { shelf: "pp_windowsill_shelf" };

  /* Practice wins over anything else; the arcade reads all three modes the
     same way for every game. */
  var modes = P.mode();
  var LEARN = modes.learn;

  /* The practice board, its tray order and its one-solution guarantee all
     live with the rules, where the tests can reach them. */
  var LEARN_BOARD = R.PRACTICE;

  var shelfKind = R.SHELVES.find(function (s) { return s.key === P.read(KEY.shelf, "standard"); })
    || R.SHELVES[1];
  var BOARD = null;

  function newBoard() {
    if (LEARN) {
      BOARD = { w: LEARN_BOARD.w, d: LEARN_BOARD.d, ways: 1, tries: 1,
        tray: LEARN_BOARD.tray.map(function (p) { return { need: p.need, height: p.height }; }) };
      return;
    }
    /* A seed rather than raw randomness, so a board has a number and the
       same one can be dealt again -- which is what the daily board will
       need, and what makes a bug report about a board reproducible. */
    var seed = (Math.random() * 4294967296) >>> 0;
    BOARD = R.deal(shelfKind, P.mulberry32(seed));
    BOARD.seed = seed;
  }

  var shelf = [], tray = [], held = null, placements = 0, done = false;
  var shelfEl = document.getElementById("shelf");
  var trayEl = document.getElementById("tray");
  var movesEl = document.getElementById("moves");
  var statusEl = document.getElementById("status");
  var winEl = document.getElementById("win");
  var winLine = document.getElementById("win-line");

  /* Par is one placement per plant: a perfect round sets each one down once
     and never moves it again. It is something to aim at, not to fail. */
  function par() { return BOARD.w * BOARD.d; }

  function layOut() {
    shelf = [];
    for (var i = 0; i < BOARD.w; i++) {
      var run = [];
      for (var t = 0; t < BOARD.d; t++) run.push(null);
      shelf.push(run);
    }
    tray = BOARD.tray.map(function (p, i) { return { need: p.need, height: p.height, id: i }; });
    held = null;
    placements = 0;
    done = false;
    winEl.hidden = true;
    build();
    paint();
  }

  /* ---- drawing --------------------------------------------------------- */
  function build() {
    shelfEl.innerHTML = "";
    shelf.forEach(function (run, r) {
      var row = document.createElement("div");
      row.className = "run";
      var glass = document.createElement("div");
      glass.className = "glass";
      glass.setAttribute("aria-hidden", "true");
      row.appendChild(glass);
      run.forEach(function (_, t) {
        var cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.dataset.run = String(r);
        cell.dataset.tier = String(t);
        cell.innerHTML =
          '<div class="pips"></div><div class="verdict"></div>' +
          '<div class="want"></div><div class="plinth"></div>' +
          '<div class="plant"><div class="crown"></div><div class="pot"></div></div>' +
          '<div class="empty-label"></div>';
        cell.addEventListener("click", function () { tapCell(r, t); });
        row.appendChild(cell);
      });
      shelfEl.appendChild(row);
    });
  }

  var WORD = { happy: "happy", scorching: "scorching", leggy: "leggy" };

  function paint() {
    var lights = R.shelfLights(shelf), states = R.shelfStates(shelf);
    Array.prototype.forEach.call(shelfEl.querySelectorAll(".cell"), function (cell) {
      var r = +cell.dataset.run, t = +cell.dataset.tier;
      var plant = shelf[r][t], light = lights[r][t], state = states[r][t];

      /* The plinth is the stand: tier t sits t steps up. The plant stands on
         top of it, so its foot is the plinth's top and its head is t + height
         steps up -- which is exactly what the rule measures. */
      var floor = "calc(var(--unit) * " + t + " + 10px)";
      cell.querySelector(".plinth").style.height = floor;
      var plantEl = cell.querySelector(".plant");
      plantEl.style.bottom = floor;
      plantEl.hidden = !plant;
      if (plant) {
        plantEl.dataset.need = String(plant.need);
        /* The crown takes the height less the pot, so the plant's overall
           head height is exactly `height` units above its own step. */
        plantEl.querySelector(".crown").style.height = "calc(var(--unit) * " + plant.height + " - 9px)";
      }
      cell.querySelector(".want").innerHTML = plant
        ? '<i>' + (state === "happy" ? "✓" : "✗") + '</i> ' + R.NEEDS[plant.need]
        : "";
      cell.querySelector(".empty-label").style.bottom = "calc(" + floor + " + 6px)";

      cell.querySelector(".pips").innerHTML =
        [3, 2, 1].map(function (n) { return n <= light ? "●" : "<b>●</b>"; }).join("");
      var v = cell.querySelector(".verdict");
      /* Only said when something is wrong -- which is exactly when a player
         is looking at this cell to find out why. */
      v.textContent = state && state !== "happy" ? WORD[state] : "";
      v.className = "verdict " + (state || "");
      cell.querySelector(".empty-label").textContent = plant ? "" : "empty";
      cell.dataset.held = held && held.from === "shelf" && held.run === r && held.tier === t ? "1" : "0";

      cell.setAttribute("aria-label",
        "Run " + (r + 1) + ", " + (t === 0 ? "at the window" : t + " back") +
        ". Light " + light + " of 3. " +
        (plant ? R.describe(plant) + " — " + (state === "happy" ? "happy"
          : state === "scorching" ? "getting too much light" : "wants more light") : "empty."));
    });

    trayEl.innerHTML = "";
    if (!tray.length) {
      var none = document.createElement("p");
      none.id = "tray-empty";
      none.textContent = "All of them are on the shelf.";
      trayEl.appendChild(none);
    }
    tray.forEach(function (plant) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.dataset.need = String(plant.need);
      chip.dataset.plant = String(plant.id);
      chip.dataset.held = held && held.from === "tray" && held.plant.id === plant.id ? "1" : "0";
      chip.innerHTML = '<span class="swatch" aria-hidden="true"></span><span>' +
        R.NEEDS[plant.need] + ' <small>' + R.HEIGHTS[plant.height] + '</small></span>';
      chip.setAttribute("aria-label", R.describe(plant) + ". Pick up.");
      chip.addEventListener("click", function () { tapTray(plant.id); });
      trayEl.appendChild(chip);
    });

    /* Practice counts towards nothing, so it does not keep score. */
    movesEl.textContent = LEARN ? "" : placements + (placements === 1 ? " placement" : " placements") +
      " · par " + par();
    statusEl.textContent = summary(states);
    if (!done && R.isSolved(shelf)) finish();
  }

  /* What is wrong, in words, so nothing depends on telling two colours
     apart. Silent when there is nothing to say. */
  function summary(states) {
    if (held) return "Holding " + R.describe(held.plant) + ". Tap a place on the shelf.";
    var scorching = 0, leggy = 0, empty = 0;
    states.forEach(function (run, r) {
      run.forEach(function (s, t) {
        if (s === "scorching") scorching += 1;
        else if (s === "leggy") leggy += 1;
        else if (!shelf[r][t]) empty += 1;
      });
    });
    if (done) return "";
    var bits = [];
    if (scorching) bits.push(scorching + (scorching === 1 ? " is" : " are") + " getting too much light");
    if (leggy) bits.push(leggy + (leggy === 1 ? " wants" : " want") + " more");
    if (empty && !bits.length) return empty + (empty === 1 ? " space" : " spaces") + " left.";
    return bits.join(", ") + (bits.length ? "." : "");
  }

  /* ---- placing --------------------------------------------------------- */
  /* Tap to pick up, tap to put down. Tapping a cell that already has
     something in it swaps: what was there comes into your hand. Nothing is
     ever lost and nothing is ever wrong for good, so there is no undo to
     write -- moving it back is the undo. */
  function tapTray(id) {
    if (done) return;
    if (held && held.from === "tray" && held.plant.id === id) { held = null; paint(); return; }
    if (held && held.from === "shelf") {           /* put it back */
      var vacated = { run: held.run, tier: held.tier };
      shelf[held.run][held.tier] = null;
      tray.push(held.plant);
      held = null;
      paint();
      /* Taking one back out changes the board as much as putting one in, so
         the coaching answers it too rather than leaving a stale line up. */
      coachAfter(vacated);
      return;
    }
    var i = tray.findIndex(function (p) { return p.id === id; });
    if (i === -1) return;
    held = { from: "tray", plant: tray[i] };
    paint();
  }

  function tapCell(r, t) {
    if (done) return;
    var sitting = shelf[r][t];
    if (!held) {
      if (!sitting) return;
      held = { from: "shelf", run: r, tier: t, plant: sitting };
      paint();
      return;
    }
    if (held.from === "shelf" && held.run === r && held.tier === t) { held = null; paint(); return; }

    if (held.from === "tray") {
      tray = tray.filter(function (p) { return p.id !== held.plant.id; });
      shelf[r][t] = held.plant;
      if (sitting) tray.push(sitting);
    } else {
      shelf[held.run][held.tier] = sitting || null;   /* swap, or vacate */
      shelf[r][t] = held.plant;
    }
    placements += 1;
    held = null;
    paint();
    coachAfter({ run: r, tier: t });
  }

  /* ---- practice coaching ----------------------------------------------- */
  /* Written against the board rather than as a script of steps: whatever the
     player just did, the line says the most useful true thing about where
     they are now. A script would go wrong the moment somebody took a plant
     back out. */
  var coachEl = document.getElementById("coach");
  var coachLine = document.getElementById("coach-line");
  var taught = {};

  function coach(text) { coachLine.textContent = text; }

  var A = { 3: "a sun-lover", 2: "a bright-shade plant", 1: "a shade plant" };
  var TALLNESS = { 1: "low", 2: "mid-height", 3: "tall" };

  function runIsDone(r) {
    return shelf[r].every(Boolean) && R.shelfStates(shelf)[r].every(function (s) { return s === "happy"; });
  }

  function coachAfter(where) {
    if (!LEARN) return;
    if (done) {
      coach("That is the whole game. A plant only shades what it stands over, " +
            "which is why the stand is built in steps.");
      return;
    }
    if (!where) {
      coach("Six plants, two runs. Each one wants an exact amount of light — too much " +
            "scorches it, too little makes it leggy. Light comes in from the left.");
      return;
    }

    var r = where.run, t = where.tier, plant = shelf[r][t];
    if (!plant) {
      coach("Taken back out. Nothing here is ever lost — putting it somewhere else is the undo.");
      return;
    }
    var light = R.lightsFor(shelf[r])[t];
    var state = R.stateOf(plant, light);

    if (state !== "happy") {
      var blockers = R.blockersOf(shelf[r], t);
      if (state === "scorching" && t === 0) {
        coach("Nothing stands in front of the glass, so the front of a run is always full " +
              "sun. Only a sun-lover is happy there.");
      } else if (state === "scorching") {
        coach("Too much light: " + A[plant.need] + " in light " + light + ". It needs something " +
              "taller in front of it, or a place further back.");
      } else if (blockers.length) {
        var tall = shelf[r][blockers[blockers.length - 1]];
        coach("Not enough light: this one wants " + plant.need + " and is getting " + light +
              ". The " + TALLNESS[tall.height] + " plant in front is standing over it.");
      } else {
        coach("Not enough light — though nothing is shading it. Try it nearer the glass.");
      }
      return;
    }

    /* The two halves of the lesson, each said once, when the board has just
       demonstrated it. */
    if (runIsDone(r)) {
      var heights = shelf[r].map(function (p) { return p.height; });
      if (!taught.low && heights[0] === 1) {
        taught.low = true;
        coach("Look at that run: three of them in full sun, none shading another. A low plant " +
              "stands exactly as high as the step behind it, so it blocks nothing at all.");
        return;
      }
      if (!taught.tall && heights[0] === 3) {
        taught.tall = true;
        coach("And there is the other half: the tall one at the glass stands over both rows " +
              "behind it, so the light steps down 3, 2, 1.");
        return;
      }
      coach("That run is right. One to go.");
      return;
    }
    coach("Happy. Keep going — the light changes as you fill the run in front.");
  }

  function finish() {
    done = true;
    held = null;
    winLine.textContent = LEARN
      ? "Now the real thing: bigger shelves, and a board dealt fresh each time."
      : placements === par()
        ? "In " + placements + " placements — you never moved one twice."
        : "In " + placements + " placements. Par is " + par() + ".";
    document.getElementById("again").textContent = LEARN ? "Play a proper board" : "Start again";
    winEl.hidden = false;
    coachAfter(null);
    if (LEARN) coachAfter({ run: 0, tier: 0 });
  }

  /* Clearing puts the same board back in the tray; a new board deals another
     one. Both are free, and neither is ever a loss. */
  document.getElementById("clear").addEventListener("click", layOut);
  /* Finishing practice hands over to a real board and puts the URL back, so
     a reload afterwards does not drop the player back into practice. */
  document.getElementById("again").addEventListener("click", function () {
    if (LEARN) {
      LEARN = false;
      taught = {};
      try { history.replaceState(null, "", location.pathname.replace(/\/learn\/?$/, "")); } catch (e) { /* fine */ }
      setChrome();
    }
    dealAndLay();
  });
  document.getElementById("new").addEventListener("click", dealAndLay);

  function dealAndLay() { newBoard(); layOut(); }

  Array.prototype.forEach.call(document.querySelectorAll("[data-shelf]"), function (b) {
    b.addEventListener("click", function () {
      shelfKind = R.SHELVES.find(function (s) { return s.key === b.dataset.shelf; }) || shelfKind;
      P.write(KEY.shelf, shelfKind.key);
      markShelf();
      dealAndLay();
    });
  });

  function markShelf() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-shelf]"), function (b) {
      var on = b.dataset.shelf === shelfKind.key;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    });
  }

  function setChrome() {
    document.body.classList.toggle("learn", LEARN);
    coachEl.hidden = !LEARN;
    document.getElementById("learn-link").hidden = LEARN;
    document.getElementById("again").textContent = LEARN ? "Play a proper board" : "Start again";
  }

  setChrome();
  markShelf();
  dealAndLay();
  coachAfter(null);

  /* The test script drives the page; it needs to see the state. */
  window.__game = {
    shelf: function () { return shelf; },
    tray: function () { return tray; },
    held: function () { return held; },
    placements: function () { return placements; },
    lights: function () { return R.shelfLights(shelf); },
    states: function () { return R.shelfStates(shelf); },
    solved: function () { return R.isSolved(shelf); },
    board: function () { return BOARD; },
    /* Somewhere to solve it from, so a test does not have to search. */
    solutions: function () { return R.solutions(BOARD.w, BOARD.d, BOARD.tray, 50); },
    ways: function () { return BOARD.ways; },
    shelfKind: function () { return shelfKind; },
    learning: function () { return LEARN; },
    coach: function () { return coachLine.textContent; },
    newBoard: dealAndLay
  };
})();
</script>
</body>
</html>
