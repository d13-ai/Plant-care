# Supabase CLI config (https://supabase.com/docs/guides/local-development).
# The hosted project is ixagjvntbgyqemxxinqe; `supabase link --project-ref ixagjvntbgyqemxxinqe`.
project_id = "plant-care"

[functions.tag]
# Public tag page: anyone with the link may open it. The function only
# calls the passport(token) RPC, which returns one public plant or nothing.
verify_jwt = false

[functions.analyze]
# AI photo analysis. Keepers only, but the function checks the session
# itself (getUser) rather than the gateway — the gateway would reject the
# browser's CORS preflight, which carries no JWT. Caps calls per keeper per
# day. Needs the ANTHROPIC_API_KEY secret.
verify_jwt = false

[functions.care]
# Care guides per species, cached and shared. Keepers only; the function
# checks the session itself (verify_jwt off so the CORS preflight isn't
# blocked). Needs the ANTHROPIC_API_KEY secret.
verify_jwt = false

[functions.account-email]
# Welcome and password-reset emails. A reset is asked for by someone who
# can't sign in, so the gateway must let it through; the welcome checks the
# session itself (getUser). Deployed this way since 4 Oct 2026; without this
# entry a CLI redeploy would turn the check on and lock resets out.
verify_jwt = false

[functions.delete-account]
# Deletes the caller's own account. Checks the session itself (getUser) and
# that the sign-in is recent; verify_jwt off so the CORS preflight isn't blocked.
verify_jwt = false

[functions.report-content]
# "Report this page" on public tags and conservatories, used by people with
# no account. Takes only a page address and a reason; the page has to be
# published, and the limits are counted per page and per source.
verify_jwt = false
